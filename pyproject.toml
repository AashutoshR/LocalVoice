[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice"
version = "0.1.0"
description = "A local workbench for reproducible low-resource speech recognition research"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "numpy>=2,<3", "soundfile>=0.13", "scipy>=1.14", "jiwer>=4,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.48,<5", "datasets>=3,<5", "peft>=0.14,<1", "accelerate>=1,<2", "librosa>=0.11", "huggingface-hub>=0.28,<1"]
gradio = ["gradio>=5,<6", "huggingface-hub>=0.28,<1"]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
localvoice = "localvoice.cli:main"

[tool.setuptools]
packages = ["localvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
